<!DOCTYPE html>
<html>
<head>
    <title>Claim Prediction</title>
</head>

<body>

    <h1>Medical Claim Prediction</h1>

    <form action="/predict" method="POST">

        <label>Age:</label>
        <input type="number" name="age" required>
        <br><br>

        <label>Sex:</label>
        <input type="text" name="sex" required>
        <br><br>

        <label>Weight:</label>
        <input type="number" step="any" name="weight" required>
        <br><br>

        <label>BMI:</label>
        <input type="number" step="any" name="bmi" required>
        <br><br>

        <label>Hereditary Diseases:</label>
        <input type="text" name="hereditary_diseases" required>
        <br><br>

        <label>No. of Dependents:</label>
        <input type="number" name="no_of_dependents" required>
        <br><br>

        <label>Smoker:</label>
        <input type="number" name="smoker" required>
        <br><br>

        <label>City:</label>
        <input type="text" name="city" required>
        <br><br>

        <label>Blood Pressure:</label>
        <input type="number" step="any" name="bloodpressure" required>
        <br><br>

        <label>Diabetes:</label>
        <input type="number" name="diabetes" required>
        <br><br>

        <label>Regular Exercise:</label>
        <input type="number" name="regular_ex" required>
        <br><br>

        <label>Job Title:</label>
        <input type="text" name="job_title" required>
        <br><br>

        <button type="submit">Predict Claim</button>

    </form>

    {% if prediction %}
        <h2>Predicted Claim Amount: {{ prediction }}</h2>
    {% endif %}

</body>
</html>
